# Undertow: third VultureTracker demo, in the style of the Unreal Tournament (1999) soundtrack, built on what its
# modules measure: 16 channels, tempo 125 at speed 6 (4 rows per beat, 64-row patterns = 4 bars), 16-bit samples
# at 11 kHz (pads) to 22 kHz (bass, lead), paired stereo drum channels, volume-slide gating, and 30-40 distinct
# patterns per song.
# E minor. Sample mode (no instruments), linear slides.
# Samples: demo3/kit.yaml renders the synths (OB-Xd, Dexed) and two CC0 cymbals into samples/demo3/;
# demo3/drums.yaml renders Roland TR-8 hits from a royalty-free pack into samples/local/demo3/ (not
# redistributable, so not in the repo). Setup: python tools/fetch_instruments.py and tools/fetch_cc0.py, then
# python -m vulturetracker synth demo3/kit.yaml && python -m vulturetracker synth demo3/drums.yaml
# The patterns below are laid out by demo3/gen_patterns.py; edit either this file or the generator.
# Build: python -m vulturetracker build demo3/undertow.yaml --render demo3/undertow.wav
#
# Techniques, and where they are:
# - Paired L/R channels (pan 12 / 52): kick, snare, gate, strings and lead each play on two hard-panned
#   channels. The right-hand drum hit starts a little later into the sample (O01/O02) and quieter, which
#   gives width and a subtle flam.
# - Hat panning: every hi-hat hit carries an S8x coarse pan, so the hats wander across the stereo field.
# - Small drum offsets: ghost snares and some kicks start with O03..O08 for a softer, different attack.
# - Volume-slide gating: every 16th, the sustained string chord's volume is set and then slid down (D03 rings,
#   D09 chops), with interlocking accents on the left and right channels.
# - Lead: a soft DX7 Rhodes with chorus and reverb printed in; the right channel doubles each note a tick
#   late (SD1) and quieter, so the pair reads as one wide, subdued instrument.
# - Detune: the right-hand gate and string voices get FF1/EF1 fine slides, a few cents off the left.

module:
  title: Undertow
  tempo: 125          # BPM = tempo x 24 / (speed x rows per beat) = 125 x 24 / (6 x 4)
  speed: 6
  global_volume: 128
  mix_volume: 92
  linear_slides: true
  channels:
    - {name: Kick L,     pan: 12, volume: 22}
    - {name: Kick R,     pan: 52, volume: 22}
    - {name: Snare L,    pan: 12, volume: 64}
    - {name: Snare R,    pan: 52, volume: 64}
    - {name: Gate L,     pan: 12, volume: 42}
    - {name: Gate R,     pan: 52, volume: 42}
    - {name: Bass,       pan: 32, volume: 43}
    - {name: Hats A,     pan: 20, volume: 45}
    - {name: Hats B,     pan: 44, volume: 45}
    - {name: Strings L,  pan: 12, volume: 30}
    - {name: Strings R,  pan: 52, volume: 30}
    - {name: Lead L,     pan: 20, volume: 30}
    - {name: Lead R,     pan: 44, volume: 30}
    - {name: Perc,       pan: 36, volume: 56}
    - {name: FX,         pan: 32, volume: 56}

