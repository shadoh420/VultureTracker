# Nadir: the first piece of a suite inspired by the Unreal Tournament (1999) soundtrack, this one by its dark,
# sub-heavy tracks (Skyward Fire, Seeker, Enigma, Colossus, Nether Animal, Mechanism Eight). Nothing from those
# modules is used: no audio, no sample data, no melodic cell; what they contributed is described in PROVENANCE.md
# (a driving grid under a dark mood, a sub drone under everything, modal pedals instead of chord progressions, a
# 16th arp, a dotted-8th sequence line, a portamento riff with an echo, a choir cluster, long crescendo arcs with a
# one-pattern dip, a recorded drum bar chopped with sample offsets in surround).
# v4 (2026-09-22): the melodic layer reworked after the v3 verdict, the drums untouched: the melody is a soft synth lead
# (Surge XT "Polysynths/Xpander 1", two phrases per colour) doubled by the recorded violin section on its own channel,
# the arp is a dark quick tone ("Leads/Cottage", one sample rooted at D-4), and the dotted sequence has its own soft
# voice ("Polysynths/Xpander 2") in its own slot (25), so each of them can be swapped in the tryout tab and balanced
# with the mixer's faders.
# v5 (2026-09-22), from the first listening notes (nadir.notes.md): the synth and string beds hold root and fifth only
# (the add9 voicings put A and Bb a semitone apart inside every pad) and the choir call is G D A G without its E; the
# sequence, lead and violin notes no longer stack (short fadeouts) and the sequence lost its echo; the B section stays
# on G with the riff and the second arp
# figure (the Bb-major lift read as a tone shift), the intro hats are sparse offbeats without the sweep and the intro
# arp is louder. The drums are otherwise untouched.
# v6 (2026-09-22, the last pass, from the second notes): the dotted sequence line is gone (every candidate for it was
# rejected and "anything SEQ plays" disliked); the groove patterns a3/a4 carry the melody instead; the B section has
# no arp figure under the riff and its groove plays the closed hat on the ride's rows ("the drums sound like a rock
# song"); the breakdown is on G like the rest and three patterns long (the C-Mixolydian colour read as "weird and out
# of place", "prog rock nonsense"); the last peak's 16ths use the first arp figure. Slots 7 (ride), 17 and 22 (the C
# beds) and 25 (the sequence voice) stay in the kit unused. The choir call is G D G: its ninth (A) sat a semitone from
# the riff's and the melody's Bb on about 40 % of the rows of b6, p5 and p7 (harmony.py). The drums are otherwise row
# for row v5's.
# Tempo 120 at speed 5 (9.6 rows/s): 4 rows per beat at 144 BPM, 16-row bars, 64-row patterns of four bars (6.67 s),
# 34 patterns, 3:47, loops to order 4. One pitch collection throughout (the notes of F major) under one pedal, G
# (Dorian), since v6: no chord progression and no change of colour, the form is texture alone.
# 20 channels. Sounds: the drone, pulse and wind are additive and noise models (suite/nadir/gen_samples.py); the
# drums are CC0 Big Rusty recordings (gen_drums.py); the string beds and the violins are CC0 VSCO 2 section
# recordings (gen_strings.py); the synth beds, choir, arp, sequence voice and lead are Surge XT patches rendered by
# kit.yaml with rooms and chorus, then given a noise floor by gen_floor.py (plain patches read as chiptune); the riff
# voice is demo4's near-sine. Every sample is resampled to 44.1 kHz when compiling (module sample_rate) so playback neither images
# nor aliases, and renders are mixed oversampled. The patterns are laid out by gen_patterns.py: it rewrites
# everything after `patterns:` and discards hand edits made there since.
# Build: python -m vulturetracker build suite/nadir/nadir.yaml --render suite/nadir/nadir.wav

module:
  title: Nadir
  tempo: 120
  speed: 5
  global_volume: 128
  mix_volume: 82
  linear_slides: true
  sample_rate: 44100
  channels:
    - {name: Kick,        pan: 32, volume: 64}
    - {name: Snare,       pan: 34, volume: 64}
    - {name: Hats,        pan: 40, volume: 64}
    - {name: Perc,        pan: 28, volume: 48}
    - {name: Loop,        pan: 32, volume: 64}
    - {name: Pulse,       pan: 32, volume: 12}
    - {name: Drone,       pan: 32, volume: 30}
    - {name: Bed A,       pan: 32, volume: 44}
    - {name: Bed B,       pan: 32, volume: 41}
    - {name: String bed,  pan: 32, volume: 56}
    - {name: Arp,         pan: 24, volume: 60}
    - {name: Seq,         pan: 22, volume: 56}
    - {name: Seq echo,    pan: 44, volume: 56}
    - {name: Riff,        pan: 38, volume: 23}
