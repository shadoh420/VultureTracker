# Sound candidates for Nadir, rendered into the gitignored samples/local/nadir-cand/ and measured by
# suite/nadir/measure.py (centroid, attack, decay, flatness) so the picks in kit.yaml are made against the piece's
# targets: dark slow beds, a vowel-like choir cluster, a soft hollow arp tone, a subdued sequence voice, high strings
# and low atmospheres. Render: python -m vulturetracker synth suite/nadir/cand.yaml
out_dir: ../../samples/local/nadir-cand
sample_rate: 44100
defaults: {normalize: -1.0, mono: true, velocity: 100, tail: 1.0}

samples:
  # ---- beds: the G Dorian voicing the song uses (G D A Bb E), 5 s holds
  bed_distant:   {patch: "Pads/Distant", chord: [G-2, D-3, A-3, A#3, E-4], hold: 5.0}
  bed_ghost:     {patch: "Pads/Ghost Pad", chord: [G-2, D-3, A-3, A#3, E-4], hold: 5.0}
  bed_moody:     {patch: "Pads/Moody Statement", chord: [G-2, D-3, A-3, A#3, E-4], hold: 5.0}
  bed_still:     {patch: "Pads/Still", chord: [G-2, D-3, A-3, A#3, E-4], hold: 5.0}
  bed_well:      {patch: "Pads/Well", chord: [G-2, D-3, A-3, A#3, E-4], hold: 5.0}
