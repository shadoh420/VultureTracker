# Third candidate batch for Nadir (2026-09-22), for the melodic rework after the v3 verdict: the arp 8ths and the
# violin line entering at 0:20 were "anemic", the dotted sequence in the Uni 1 detuned-saw tone was hated. Three
# roles, each rendered with its role's room and rate so the measurements (suite/nadir/measure.py) compare like with
# like: `lead_` (the melody voice, a held E-5 in the line's register), `arp3_` (a short G-4), `seq3_` (a held G-4 for the
# sequence line). Wanted: dark (low centroid), soft attack for the lead and the sequence, no buzz (a low flatness
# spread between the harmonics is fine, the floor script adds hiss later), a steady hold with some chorus movement.
# No bells, plucks, pizzicati, squares, flutes or detuned saws are in this list on purpose.
# Render: python -m vulturetracker synth suite/nadir/cand3.yaml && python suite/nadir/measure.py samples/local/nadir-cand3
out_dir: ../../samples/local/nadir-cand3
sample_rate: 44100
defaults: {normalize: -1.0, mono: true, velocity: 100, tail: 1.0}

samples:
  # ---- the melody voice: a held E-5, chorus, a hall, 22 kHz
  lead_distance:  {patch: "Leads/In The Distance", note: E-5, hold: 2.0, tail: 1.2,
                   fx: &leadfx [{chorus: {rate_hz: 0.5, depth: 0.3, centre_delay_ms: 8, feedback: 0.05, mix: 0.35}}, {reverb: {room_size: 0.7, damping: 0.5, wet_level: 0.35, dry_level: 0.7}}, {resample: {target_sample_rate: 22050}}]}
  lead_hollow:    {patch: "Leads/Smoothy Hollow", note: E-5, hold: 2.0, tail: 1.2, fx: *leadfx}
  lead_somewhere: {patch: "Leads/Somewhere MW", note: E-5, hold: 2.0, tail: 1.2, fx: *leadfx}
