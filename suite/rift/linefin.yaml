# Rift, step 2: the line finalists of line.yaml, chosen by measurement against the role's traits in BRIEF.md (nearly
# pure, a soft or swelling attack, dark: centroid near the fundamental, some motion): Dexed Mute SINES (173 ms attack),
# Surge Gentle (swells in over 0.6 s), Surge Lera (pure, moving), Surge Smoothness World Cup (pure, steady) and Dexed
# SOFT TOUCH (0.5 s attack, a little brighter; the synth's check hears its attack an octave up, the held note is at the
# key). Rooted at A-5, the
# middle of the line (C-5..C-6), looped, a room printed in, 11 kHz wide; suite/rift/gen_cand.py lines adds the floor.
# Render: python -m vulturetracker synth suite/rift/linefin.yaml && python suite/rift/gen_cand.py lines
out_dir: ../../samples/local/rift-cand
sample_rate: 44100
defaults:
  note: A-5
  hold: 3.5
  tail: 1.5
  normalize: -1.0
  mono: true
  velocity: 90
  loop: {start: 1.2, end: 3.2, crossfade: 0.8}
  fx: [{reverb: {room_size: 0.75, damping: 0.5, wet_level: 0.35, dry_level: 0.7}}, {resample: {target_sample_rate: 22050}}]

samples:
  line_sines:  {patch: "dexed:SynprezFM_16/Mute SINES"}
  line_gentle: {patch: "Polysynths/Gentle"}
  line_lera:   {patch: "Leads/Lera"}
  line_smooth: {patch: "Leads/Smoothness World Cup"}
  line_touch:  {patch: "dexed:SynprezFM_22/SOFT TOUCH"}
