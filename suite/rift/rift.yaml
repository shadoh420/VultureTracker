# Rift (working title), step 1: two bars of drums, sub and bass stab, played twice (the crash on the first pass only),
# for picking the sounds in the tryout. Each slot starts on its first candidate (rift.tryout.json lists them; U writes
# a pick). From BRIEF.md, kept: sampled breaks chopped with sample offsets, quiet 8th hats, a crash on the pattern start,
# the low end loudest, a kick-with-a-looped-cycle sub, a noisy bass stab, one root with passing tones. Changed from the
# reference: tempo 110 speed 4 (165 BPM), A minor at A440, our own rows.
# Break: the sample is our two-step bar (kicks 0 and 10, snares 4 and 12, ghosts 2, 7 and 14, 8th hats), started on
# each bar; in bar 2 it is re-struck on row 28 at its row-10 kick (O9C), so bar 2 ends kick, kick, snare on 26, 28, 30.
# Hats: every 8th, v16 on the beat and v10 off it. Sub (A-2, 55 Hz): A with the kicks on 0, 10, 16 and 26, then E (a
# fifth under) on 28, back to A. Stab (A-3): on the second kick of each bar, 10 and 26.
# Step 2: the bed, one A minor chord (A-3 E-4 C-5; the reference's bed was an open fifth) per pattern on a surround
# channel, crossfading into the next (nna fade); the loop plays twice so the bed is heard held and re-struck.
# Step 2, the call, fourth round. Before: the long-note melody was "too melodic for a drum and bass track"; the one-figure
# calls of hooks.yaml "too sparse and front loaded", the falling E D A the closest; the third round's call (E D A every
# two bars, one volume, the same rows each time, steady voices) "doesn't feel dynamic enough, both the melody and the
# sound". Now, still a falling call every two bars through the 8 (loop = bars 1-4, loop_b = 5-8; A minor pentatonic,
# G-4..G-5): bars 1-2 broad, E (v64) D (v44, cut short) A (v56, held, faded at row 26); bars 3-4 the answer higher and
# off the beat, G-5 E D on rows 34, 38, 43 (a 16th after the kick) and a quiet C pickup (v34) into bar 5; bars 5-6 the
# call quicker, E D A a dotted 8th apart; bars 7-8 the close low, D C A, and a D pickup back to the top. Note fades (~~~)
# set the lengths. Channel 8 echoes only the accented and held notes, 3 rows later at v22-24, faded after 8-10 rows.
# Instrument 7 moves on every note (the app's INSTRUMENT panel reads and changes it): a 1-tick attack and a 12-tick
# decay to 44 (-3.3 dB), a low-pass at 96 (about 3 kHz, resonance 24) that opens from 36/64 of it over 10 ticks, and
# 12 % random volume. Slot 7 holds single notes (callfin.yaml, sounding C-5), picked by measurement from
# suite/rift/screen.py; suite/rift/clash.py counts the clash rows. Channels 1-6 are unchanged in both patterns.
# Candidates: suite/rift/gen_cand.py (cand.yaml: the stab screen; bed.yaml, bedfin.yaml: the bed; line.yaml,
# linefin.yaml: the rejected line voices; hooks.yaml: the one-figure calls; callfin.yaml: the call voices) into
# samples/local/rift-cand/.
# Superseded 2026-09-22 (evening): the round-4 call is silenced, not deleted (channels 7 and 8 `muted: true`; their cells,
# slot 7 and instrument 7 with the owner's panel edits are kept as they were).
# Layer 1 of BRIEF.md's layer plan (2026-09-22, evening; the owner's "follow the references"): the sequence, written the
# way Nether Animal writes its sequence, with our own cells (suite/rift/gen_seq.py pattern writes channels 9-11; don't
# edit them by hand). 8ths on every beat and offbeat; one voice restarted on row 0 of each pattern (v36) and moved legato
# (GFF) on every other note; A minor, our head E A D A (E-5 A-5 D-6 A-5) opening every bar (once also on G), three bars
# that stay and a fourth that changes per pattern (A B C D, A B C E); copies of every note on channel 10 (+2 rows, v6 = -15.6 dB, pan
# 34) and 11 (+3 rows, v12 = -9.5 dB, pan 56), the main at pan 17, each copy restarting on its first note of the pattern
# (rows 0 and 1): the reference's delays, levels and pans. Instrument 8 has no envelopes (the reference runs in sample
# mode). Slot 8 holds single notes sounding E-3, played 19-36 semitones up (gen_seq.py, from seq.yaml's renders and a
# CC0 glass); the sequence sits about 8 dB under the sub, as the reference's does.
# Layer 2 (the lead call; suite/rift/gen_lead.py pattern writes channels 12-13, don't edit them by hand): once per
# pattern, in its first bar, three notes on the 8ths from row 2 alternating two channels (E-5 C-5 A-4, ours), each channel
# re-striking its last note 4 and 8 rows later at v14 and v8 (the reference's 30/14/8), in loop_b two new notes (D-5 G-4)
# instead, each re-struck once; the reference's fades after each note (D03 for three rows after a v30 note, D01 after the
# re-strikes), both channels cut on row 32, centred. Slot 9 holds one-shots sounding D-4, played 5-14 semitones up
# (gen_lead.py: five of the finalists of three screens, made like the reference's lead sample); the call sits about
# 10.6 dB under the sub, as the reference's does.
# Layer 3 (the tonal hit; suite/rift/gen_hit.py pattern writes channels 14-15, don't edit them by hand): one hit on row 0
# of every bar, alternating two channels (each rings two bars), A-5 at v64, started 2.3 % into the sample (O0F), centred:
# the reference's idioms. Slot 10 holds rough one-shots stored at G-5 +60 cents, so the hit sounds A +60 cents, between the
# root and the minor second as the reference's does (gen_hit.py: five finalists of three screens, made like the reference's
# hit sample); the hits sit 12.4 dB under the sub, as the reference's do.
# Layer 4, the surround bed: the approved bed_endgame stays as it is (the owner's word).
# Layer 5 (the strings; suite/rift/gen_strings.py pattern writes channels 16-21, don't edit them by hand): two
# three-voice groups a pattern, one struck on row 0 (channels 16-18) and one on row 32 (19-21), each held 32 rows and
# faded from the other group's strike (D02, then D00 for 18 rows), S87 on every note (the reference's six voices share
# one pan), the sample's own volume: the reference's idioms. Our chord: F major seventh over the A root (the reference's
# colour, a major seventh on the minor sixth), voiced F-4 C-5 A-5 on row 0 and E-4 E-5 A-5 on row 32: no group holds the
# major seventh itself, it sounds where the groups overlap, as in the reference. Slot 11 holds bowed notes stored at A-4
# with a swell and a 1.85 s loop (gen_strings.py: five finalists of three screens, made like the reference's string
# sample); the strings sit 8.6 dB under the sub, as the reference's do.
# Layer 6 (the drone; suite/rift/gen_drone.py pattern writes channel 22, don't edit it by hand): one chord sample held
# on A, restated with the instrument by a legato note (GFF) on row 0 of each pattern, never retriggered or moved; the
# movement is in the volume column: loop swells from v30 to v40 over 16 rows, loop_b holds v40 (the reference's
# alternation while its vocal pad and second line play; before it, a v7 entry swell and nine flat v30 patterns: form
# work), pan 29: the reference's idioms (its 18 drone notes carry one written pitch). Our chord: A minor, voiced A-3
# E-4 A-4 C-5 inside the sample. Slot 12 holds chords stored at A-3 with the reference's swell and a 3.86 s loop
# (gen_drone.py: five finalists of three screens, made like the reference's drone sample); the drone sits 9.6 dB under
# the sub, as the reference's does.
# Layer 7 (the noise; suite/rift/gen_noise.py pattern writes channel 23, don't edit it by hand): one dark noise one-shot
# struck on row 0 of `loop` (every second pattern; nothing in `loop_b`), A-3 S89 (pan 38) at the sample's own volume (no
# fades: it plays out): the reference's idioms (its 19 noise notes carry one written pitch; every pattern in its orders
# 0-6 and every fourth in C are form work). Slot 13 holds 5.14 s noise one-shots stored at B-3 and played at A-3, 2
# semitones under (the reference's relation: 5.77 s as played; saturn's and timproll's tuned resonances sounding on an A,
# the other three unpitched) (gen_noise.py: five finalists of three screens, made like the reference's noise sample);
# the noise sits 12.0 dB under the sub, as the reference's does.
# Layer 8 (the vocal pad; suite/rift/gen_vocal.py pattern writes channel 24, don't edit it by hand): one breathy chord
# sample struck on row 0 of `loop` at v5 and swelled one step a row to v23 over 16 rows, restated by a legato note (GFF)
# at v23 on row 0 of `loop_b`, pan 32: the reference's idioms (its 8 vocal notes carry one written pitch; its strike every
# fourth pattern with three legato restatements between, and its closing fade, are form work). Our chord: A minor,
# voiced A-3 E-4 C-5 (sounding), its lowest tone on the drone's. Slot 14 holds chords stored 11 semitones under (A#2)
# and played at A-3, as the reference plays its sample, with the reference's swell and a 2.18 s loop as stored (1.15 s
# as played) (gen_vocal.py: five finalists of three screens, made like the reference's vocal sample); the vocal pad
# is set 11.9 dB under the sub, the reference's level (the -1 dBFS peak limit holds two candidates 12.1 and 12.8 dB
# under; the placeholder obghost 12.8). Picked 2026-09-23 22:46: vocal_obghost.
# Layer 9 (the second line; suite/rift/gen_second.py pattern writes channels 25-26, don't edit them by hand): a figure in
# bar 1 of `loop`, B-4 A-4 C-5 B-4 E-4 A-4 on rows 0 2 4 6 10 14 (ours), the second glided into (G54), the sixth held and
# faded by the volume column to silence on row 43, gliding on to B-4 on row 18 (G20, at the fade's level); a pickup
# G-4 A-4 B-4 on rows 58-62, faded out by `loop_b`'s first rows (DF8, D00); an echo channel 3 rows later at -7.2 dB with
# its own fade (not on the pickup); both centred: the reference's idioms (its line plays every second pattern, alternating
# this fuller pattern with one whose sixth is held without the glide: form work), its volumes written x4 (its v16 is its
# sample's default volume; ours is 64). Slot 15 holds soft tones stored at A#3 and played 6-14 semitones up, as the
# reference plays its sample (6-18), 5.55 s with a 2.66 s ping-pong loop (gen_second.py: five finalists of three
# screens, made like the reference's second-line sample); the line is set 10.3 dB under the sub, the reference's level.
# Picked 2026-09-24 05:35: second_sine.
# Step 3, the form (suite/rift/gen_form.py writes every pattern and the order list; don't edit them by hand): Nether
# Animal's form map, 55 orders in its section lengths (BRIEF.md "## Form"): intro 0-3, build 4-9, A 10-17, break 18-19,
# B 20-23, peak 24-29, break 30-31, C 32-48, outro 49-54 (5:20 at 165 BPM). Each layer plays where the reference's
# plays, its columns from its own writer: the loop's figures and the form's variants (the hit two a pattern without the
# offset in A and the peak's first two, the strings' closing fade, the drone's entry swell, flat v30 and fade, the vocal
# pad's strike every fourth pattern and fade, the second line's other pattern in orders 41 and 45, and their exits).
# The approved break, hats, crash, sub, stab and bed are the loop's cells row for row (rift_loop.yaml, the 8-bar loop
# the sounds were picked in), each inside the rows the form gives it, cut or faded where they leave, and the last bar
# steps the drums down as the reference's does. The layer paragraphs above describe the loop: their gen_*.py pattern
# commands write nothing here. The plan, and each departure from the reference's map with its reason:
# suite/HANDOFF.md item 2, "Step 3".
module:
  title: Rift
  tempo: 110
  speed: 4
  mix_volume: 64
  sample_rate: 44100
  channels:
    - {name: Break, pan: 32, volume: 64}
    - {name: Hats,  pan: 32, volume: 64}
    - {name: Crash, pan: 32, volume: 64}
    - {name: Sub,   pan: 32, volume: 64}
    - {name: Stab,  pan: 32, volume: 44}
    - {name: Bed,   pan: surround, volume: 34}
    - {name: Call,  pan: 32, volume: 64, muted: true}
    - {name: Call echo, pan: 32, volume: 64, muted: true}
    - {name: Seq, pan: 17, volume: 64}
    - {name: Seq copy 2, pan: 34, volume: 64}
    - {name: Seq copy 3, pan: 56, volume: 64}
    - {name: Lead A, pan: 32, volume: 64}
    - {name: Lead B, pan: 32, volume: 64}
    - {name: Hit A, pan: 32, volume: 64}
    - {name: Hit B, pan: 32, volume: 64}
    - {name: Str 1, pan: 32, volume: 34}
    - {name: Str 2, pan: 32, volume: 26}
    - {name: Str 3, pan: 32, volume: 18}
    - {name: Str 4, pan: 32, volume: 40}
    - {name: Str 5, pan: 32, volume: 18}
    - {name: Str 6, pan: 32, volume: 22}
    - {name: Drone, pan: 29, volume: 64}
    - {name: Noise, pan: 32, volume: 64}
    - {name: Vocal, pan: 32, volume: 64}
    - {name: Second, pan: 32, volume: 64}
    - {name: Second echo, pan: 32, volume: 64}

