  1: {name: Break, sample: 1}
  2: {name: Hats, sample: 2}
  3: {name: Crash, sample: 3}
  4: {name: Sub, sample: 4, volume_envelope: {nodes: [[0, 64], [6, 58], [40, 38], [140, 0]]}}   # an 808 decay: -5 dB by row 10
  5: {name: Stab, sample: 5, volume_envelope: {nodes: [[0, 64], [6, 44], [14, 0]]}}             # cut after about three rows
  6: {name: Bed, sample: 6, nna: fade, fadeout: 8}   # a re-struck bed crossfades over about 3 s
  7: {name: Call, sample: 7, nna: fade, fadeout: 128, volume_envelope: {nodes: [[0, 0], [1, 64], [13, 44]], sustain: 2}, filter_cutoff: 42, filter_resonance: 24, pitch_envelope: {nodes: [[0, 4], [10, 32]], filter: true}, random_volume: 12}  # a new note or ~~~ fades the one before it out over two rows
  8: {name: Seq, sample: 8}   # sample mode, as in the reference: no envelopes; the movement is in the pattern
  9: {name: Lead, sample: 9}   # sample mode, as in the reference: the call's movement is in the pattern
  10: {name: Hit, sample: 10}   # sample mode, as in the reference
  11: {name: Strings, sample: 11}   # sample mode, as in the reference: the fades are in the pattern
  12: {name: Drone, sample: 12}   # sample mode, as in the reference: the swells are in the pattern
  13: {name: Noise, sample: 13}   # sample mode, as in the reference: a one-shot at its own volume
  14: {name: Vocal, sample: 14}   # sample mode, as in the reference: the swell is in the pattern
  15: {name: Second, sample: 15}   # sample mode, as in the reference: the fades and glides are in the pattern

