# Vantage: fourth VultureTracker demo, in the style of a late-90s arena-shooter module: a sub-bass drone
# holds the tonic under the whole song, a synth riff on three round-robin channels rides over it, chord samples
# sit low in the mix (a minor bed, a major bed that swells once per pattern, a three-chord motif with an echo),
# a choir calls in the build and the break, drums arrive late and leave for the break, and there is no lead
# melody and no chord progression: every chord is rooted on E.
# 16 channels, tempo 140 at speed 5 (168 BPM; 4 rows per beat, 64-row patterns = 4 bars), 16-bit samples
# band-limited to 11 kHz (beds, choir) or 22 kHz (riff, bass, motif), 32 patterns, 3:03, loops to order 2.
# Samples: the riff and the sub bass are additive models (demo4/gen_samples.py); the beds, motif chords and the
# choir are Surge XT factory patches rendered by demo4/kit.yaml (python -m vulturetracker synth demo4/kit.yaml).
# Drums: the break is generated from the CC0 Big Rusty Drums kit by demo4/gen_break.py (in the repo);
# demo4/drums.yaml picks a snare and an open hat from MusicRadar's free drum-machine pack and prints a room onto
# the snare (samples/local/demo4/, not redistributable, so not in the repo); the kick, ride and crashes are
# demo3's TR-8 renders (samples/local/demo3/, python -m vulturetracker synth demo3/drums.yaml).
# The patterns below are laid out by demo4/gen_patterns.py. This file is the source of truth and the generator is its
# scaffold: rerunning it rewrites everything after `patterns:` and discards hand edits made here since, so port such
# edits into the generator or stop rerunning it.
# Build: python -m vulturetracker build demo4/vantage.yaml --render demo4/vantage.wav
# PROVENANCE.md records what this demo took from its reference track and what was changed to keep it its own.
#
# Techniques, and where they are:
# - Riff: one sustained near-sine voice whose pitch steps every 8th with GFF tone portamento (no retrigger,
#   no attacks), plus two channels repeating it a 16th and two 16ths behind at a fraction of the volume; in the
#   groove it appears only as a dying single voice on alternate patterns.
# - Sub-bass drone: one looped tonic note, retriggered at the top of every pattern and the loudest layer
#   (E-1 in the intro, E-2 from the first groove on).
# - Beds: the minor bed is retriggered every pattern so its slow swell breathes with the form; the major
#   bed fades out over the first bar, re-enters quiet on row 36 and slides up (D10), and dies again from row 56.
#   Both beds play in surround (S91): with the break, that is where the width comes from.
# - Motif: three chord samples on rows 0, 5 and 10, echoed six rows later at 40% volume on a channel panned the
#   other way, then faded with D01/D00 and DF3/D00 over the second bar.
# - Choir call: the cluster an octave up on row 0, at pitch on row 8, echoed, fading with DF2/D00.
# - Hats: one cymbal hit every 8th, cut by the next, sweeping S81 to S8F and back one step per hit; ghost pairs
#   on rows 13 and 15 of every other bar. Snares on 4 and 10, then 4 and a quiet 12.
# - Break: one bar of breakbeat played by the CC0 Big Rusty Drums kit (demo4/gen_break.py), retriggered on rows
#   0, 6, 16, 32, 38, 48 with a pickup on 62, in surround (S91: the out-of-phase image that makes the mix wide);
#   the kick section replays its beat-2 snare on row 60 with an O-offset, and a crash marks each turnaround. In
#   the intro only the pickups play.
# - Kick section: the TR-8 kick four on the floor with open hats on the 'and' of 1, 3 and 4.
# - Riser: the reverse crash lands on the next downbeat; the cymbal swell peaks on it.

module:
  title: Vantage
  tempo: 140
  speed: 5
  global_volume: 128
  mix_volume: 128
  linear_slides: true
  channels:
    - {name: Kick,       pan: 32, volume: 26}
    - {name: Snare,      pan: 32, volume: 40}
    - {name: Hats,       pan: 40, volume: 32}
    - {name: Perc,       pan: 24, volume: 31}
    - {name: Break,      pan: 32, volume: 64}
    - {name: Riff 1,     pan: 28, volume: 20}
    - {name: Riff 2,     pan: 8,  volume: 20}
    - {name: Riff 3,     pan: 56, volume: 20}
    - {name: Bed minor,  pan: 32, volume: 24}
    - {name: Bed major,  pan: 32, volume: 19}
    - {name: Motif,      pan: 24, volume: 19}
    - {name: Motif echo, pan: 60, volume: 19}
    - {name: Bass,       pan: 32, volume: 44}
    - {name: Choir,      pan: 28, volume: 30}
    - {name: Choir echo, pan: 44, volume: 30}
    - {name: FX,         pan: 32, volume: 50}

samples:
  1:  {file: ../samples/local/demo3/kick.wav, name: TR-8 kick}
  2:  {file: ../samples/local/demo4/snare.wav, name: Airbase snare + room}
  3:  {file: ../samples/local/demo4/hat.wav, name: HR-16 cymbal hat}
  4:  {file: ../samples/local/demo3/ride.wav, name: TR-8 ride}
  5:  {file: ../samples/local/demo3/crash.wav, name: TR-8 crash}
  6:  {file: ../samples/local/demo3/revcrash.wav, name: Reverse crash, stereo: true}
  7:  {file: ../samples/demo4/riff.wav, name: Sine riff, base_note: E-5, loop: from_wav}
  8:  {file: ../samples/demo4/bed1.wav, name: Minor bed, base_note: C-5, loop: from_wav}
  9:  {file: ../samples/demo4/bed2.wav, name: Major bed, base_note: C-5, loop: from_wav}
  10: {file: ../samples/demo4/bass.wav, name: Sub bass, base_note: E-2, loop: from_wav}
  11: {file: ../samples/demo4/choir.wav, name: Choir cluster, base_note: C-5, loop: from_wav}
  12: {file: ../samples/demo4/motif1.wav, name: Motif add9, base_note: C-5, loop: from_wav}
  13: {file: ../samples/demo4/motif2.wav, name: Motif 7sus4, base_note: C-5, loop: from_wav}
  14: {file: ../samples/demo4/motif3.wav, name: Motif m9, base_note: C-5, loop: from_wav}
  15: {file: ../samples/demo3/swell.wav, name: Cymbal swell, stereo: true}
  16: {file: ../samples/demo3/gong.wav, name: Gong, stereo: true}
  17: {file: ../samples/demo4/break.wav, name: Big Rusty break}
  18: {file: ../samples/local/demo3/hat_open.wav, name: TR-8 open hat}

