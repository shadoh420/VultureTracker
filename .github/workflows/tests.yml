# The tests in three environments. Both Linux jobs build patched libopenmpt 0.8.9 below. Their Python package setup
# matches .claude/hooks/session-start.sh: requirements-test.txt pins packages and SHA-256 digests for Python 3.10 on.
# Node runs the live engine and the Faust compiler. `tests` also installs Playwright's Chromium and is the only job
# that runs the page tests. Every job installs the pinned file with --require-hashes,
# then the package itself without dependencies or build isolation (setuptools is pinned there too), so nothing
# unpinned comes from PyPI. Regenerate the file after a
# change to pyproject.toml's test extra with the command in its header (uv: one file with markers covers 3.10's
# numpy and 3.14's, which pip-compile cannot). `floor` is the same on
# the oldest Python pyproject.toml allows, portable tests only. `windows` is the shipped environment: Python 3.14 as the
# exe, libopenmpt 0.8.9 from vendor/ (openmpt.py loads the DLL by its path next to the package, so nothing is installed
# for it), the repository checked out with the runner's core.autocrlf=true as on the owner's PC.
#
# Page tests run on Linux only: tests/test_page.py launches Playwright's Chromium (or VT_CHROMIUM) in a way that would
# work on Windows too, but they were only ever run against Linux Chromium and Edge, and they take several minutes; the
# Windows job checks the engine, the compiler and the app's server, not the browser.
# Windows runs the exe's Python 3.14. (Until 2026-10-08 it had to: with PyYAML's libyaml loader, a song nested about
# 5000 levels deep overflowed the C stack on Windows (1 MB main thread) under 3.10-3.13 and killed the process; song.py's
# BoundedLoader now refuses such text before composing it, and tests/test_pipeline.py checks that case.)
# The synth and module-import tests skip everywhere (they need the plugins and the fixtures): the fixtures come from
# tests/fetch_fixtures.py, which reads libxmp's master without a pinned commit or a digest, and Surge is a 300 MB
# Windows-only plugin; neither is fetched in CI.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer push to the same branch or pull request cancels the run still going for the older one
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  VT_REQUIRE_NATIVE_SCORE: "1"
  VT_REQUIRE_PITCH: "1"
  VT_REQUIRE_GAIN: "1"
  VT_REQUIRE_GROUPS: "1"
  # the portable tests, one list for every job (test_engine needs node)
  PORTABLE: >-
    tests.test_gui tests.test_pipeline tests.test_resample tests.test_engine
    tests.test_modimport tests.test_compose tests.test_record tests.test_library tests.test_mosaic
    tests.test_spectral tests.test_gpimport tests.test_midiimport tests.test_faust tests.test_workflow
    tests.test_release070 tests.test_release080 tests.test_release080_import tests.test_release080_dsp
    tests.test_import tests.test_synth tests.test_sources tests.test_release100 tests.test_stems_to_song
    tests.test_plugins tests.test_measure tests.test_agent tests.test_agent_projects
    tests.test_agent_sessions tests.test_malformed tests.test_docs tests.test_vendor tests.test_tg_format tests.test_gplegacy tests.test_gpexport_legacy tests.test_gpx tests.test_notation_export
    tests.test_tablature tests.test_tablature_sync
    tests.test_band_imports tests.test_band_expression tests.test_band_instruments tests.test_band_delivery
    tests.test_rehearsal_setup tests.test_rehearsal_edit tests.test_score_collection tests.test_real_arrangement

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential pkg-config libmpg123-dev libogg-dev libvorbis-dev zlib1g-dev
          native_source="$RUNNER_TEMP/native-score-engine"
          curl --fail --location --retry 3 https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-0.8.9+release.makefile.tar.gz -o "$RUNNER_TEMP/libopenmpt-source.tar.gz"
          mkdir -p "$native_source"
          tar -xzf "$RUNNER_TEMP/libopenmpt-source.tar.gz" -C "$native_source" --strip-components=1
          patch -d "$native_source" -p1 < "$GITHUB_WORKSPACE/tools/native-score-engine.patch"
          make -C "$native_source" CONFIG=gcc SHARED_LIB=1 STATIC_LIB=0 OPENMPT123=0 EXAMPLES=0 TEST=0 -j2
          export LIBOPENMPT="$native_source/bin/libopenmpt.so"
          echo "LIBOPENMPT=$LIBOPENMPT" >> "$GITHUB_ENV"
          python -m pip install -q --require-hashes -r requirements-test.txt
          python -m pip install -q --no-deps --no-build-isolation .
          python -m playwright install --with-deps chromium
          python -c "from vulturetracker import faust; faust.have() or faust.fetch()" || true
      - name: Allow the pinned browser sandbox
        # Ubuntu's AppArmor policy blocks downloaded Chromium's user namespaces.
        # Allow only this executable; keep the production PDF sandbox enabled.
        # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
        run: |
          chromium_path=$(python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          test -x "$chromium_path"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile vt-ci-chromium "%s" flags=(unconfined) { userns, }\n' "$chromium_path" | sudo tee /etc/apparmor.d/vt-ci-chromium
          sudo apparmor_parser -r /etc/apparmor.d/vt-ci-chromium
          echo "VT_CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
      - name: Page tests
        run: >-
          python -u -m unittest -v tests.test_page tests.test_workflow_page tests.test_release070_page
          tests.test_release080_page tests.test_features080_page tests.test_release100_page
          tests.test_features_page
          tests.test_tablature_page
          tests.test_band_expression_page tests.test_band_instruments_page tests.test_band_delivery_page
          tests.test_score_collection_page tests.test_rehearsal_setup_page tests.test_real_workspace_page
          tests.test_rehearsal_arrangement_page tests.test_sounding_refresh_page tests.test_rehearsal_edit_page
          tests.test_real_arrangement_page
          tests.test_complex_rhythm tests.test_complex_rhythm_page
          tests.test_complex_interchange tests.test_complex_engraving_page
          tests.test_complex_routing tests.test_complex_routing_page
          tests.test_expressive_gp5
          tests.test_advanced_rhythm tests.test_advanced_rhythm_page tests.test_advanced_timing
          tests.test_repeat_rehearsal tests.test_repeat_rehearsal_page tests.test_performance_parts_page
          tests.test_part_adaptation tests.test_part_adaptation_page
          tests.test_rehearsal_delivery tests.test_real_interchange tests.test_rehearsal_playback
      - name: Portable tests
        run: python -m unittest $PORTABLE

  floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential pkg-config libmpg123-dev libogg-dev libvorbis-dev zlib1g-dev
          native_source="$RUNNER_TEMP/native-score-engine"
          curl --fail --location --retry 3 https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-0.8.9+release.makefile.tar.gz -o "$RUNNER_TEMP/libopenmpt-source.tar.gz"
          mkdir -p "$native_source"
          tar -xzf "$RUNNER_TEMP/libopenmpt-source.tar.gz" -C "$native_source" --strip-components=1
          patch -d "$native_source" -p1 < "$GITHUB_WORKSPACE/tools/native-score-engine.patch"
          make -C "$native_source" CONFIG=gcc SHARED_LIB=1 STATIC_LIB=0 OPENMPT123=0 EXAMPLES=0 TEST=0 -j2
          export LIBOPENMPT="$native_source/bin/libopenmpt.so"
          echo "LIBOPENMPT=$LIBOPENMPT" >> "$GITHUB_ENV"
          python -m pip install -q --require-hashes -r requirements-test.txt
          python -m pip install -q --no-deps --no-build-isolation .
          python -c "from vulturetracker import faust; faust.have() or faust.fetch()" || true
      - name: Portable tests
        run: python -m unittest $PORTABLE

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install -q --require-hashes -r requirements-test.txt
          python -m pip install -q --no-deps --no-build-isolation .
          python -c "from vulturetracker import faust; faust.have() or faust.fetch()" || true
      - name: Portable tests
        # the runner's %TEMP% is an 8.3 short path (C:\Users\RUNNER~1\...) while the app resolves paths to their long
        # form (runneradmin): tests comparing a temp path with a resolved one failed on the first runs. runner.temp is
        # long (the runner context is allowed in a step's env, not a job's)
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -m unittest $PORTABLE
