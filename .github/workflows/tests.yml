# The tests in three environments. `tests` is Linux the way .claude/hooks/session-start.sh installs it for cloud
# sessions (libopenmpt from Ubuntu, 0.7.x; the Python packages from pip; node for the live engine and the Faust
# compiler; Playwright's Chromium for the page) and is the only job that runs the page tests. `floor` is the same on
# the oldest Python pyproject.toml allows, portable tests only. `windows` is the shipped environment: Python 3.14 as the
# exe, libopenmpt 0.8.9 from vendor/ (openmpt.py loads the DLL by its path next to the package, so nothing is installed
# for it), the repository checked out with the runner's core.autocrlf=true as on the owner's PC.
#
# Page tests run on Linux only: tests/test_page.py launches Playwright's Chromium (or VT_CHROMIUM) in a way that would
# work on Windows too, but they were only ever run against Linux Chromium and Edge, and they take several minutes; the
# Windows job checks the engine, the compiler and the app's server, not the browser.
# Windows runs the exe's Python 3.14. (Until 2026-10-08 it had to: with PyYAML's libyaml loader, a song nested about
# 5000 levels deep overflowed the C stack on Windows (1 MB main thread) under 3.10-3.13 and killed the process; song.py's
# BoundedLoader now refuses such text before composing it, and tests/test_pipeline.py checks that case.)
# The synth and module-import tests skip everywhere (they need the plugins and the fixtures): the fixtures come from
# tests/fetch_fixtures.py, which reads libxmp's master without a pinned commit or a digest, and Surge is a 300 MB
# Windows-only plugin; neither is fetched in CI.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # the portable tests, one list for every job (test_engine needs node)
  PORTABLE: >-
    tests.test_gui tests.test_pipeline tests.test_resample tests.test_engine
    tests.test_modimport tests.test_compose tests.test_record tests.test_library tests.test_mosaic
    tests.test_spectral tests.test_gpimport tests.test_midiimport tests.test_faust tests.test_workflow
    tests.test_release070 tests.test_release080 tests.test_release080_import tests.test_release080_dsp
    tests.test_import tests.test_synth tests.test_release100 tests.test_stems_to_song
    tests.test_plugins tests.test_measure tests.test_agent tests.test_malformed

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libopenmpt0t64
          python -m pip install -q ".[test]"
          python -m playwright install --with-deps chromium
          python -c "from vulturetracker import faust; faust.have() or faust.fetch()" || true
      - name: Portable tests
        run: python -m unittest $PORTABLE
      - name: Page tests
        run: >-
          python -m unittest tests.test_page tests.test_workflow_page tests.test_release070_page
          tests.test_release080_page tests.test_features080_page tests.test_release100_page
          tests.test_features_page

  floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libopenmpt0t64
          python -m pip install -q ".[test]"
          python -c "from vulturetracker import faust; faust.have() or faust.fetch()" || true
      - name: Portable tests
        run: python -m unittest $PORTABLE

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install -q ".[test]"
          python -c "from vulturetracker import faust; faust.have() or faust.fetch()" || true
      - name: Portable tests
        run: python -m unittest $PORTABLE
