# The portable tests and the page tests on Linux, installed the way .claude/hooks/session-start.sh installs them for
# cloud sessions: libopenmpt from Ubuntu (0.7.x; Windows uses vendor/'s 0.8.9), the Python packages from pip, node for
# the live engine and the Faust compiler, Playwright's Chromium for the page. The synth and module-import tests skip
# (they need the plugins and the fixtures).
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libopenmpt0t64
          python -m pip install -q pyyaml numpy imageio-ffmpeg Pillow playwright pyguitarpro mido
          python -m playwright install --with-deps chromium
          python -c "from vulturetracker import faust; faust.have() or faust.fetch()" || true
      - name: Portable tests
        run: >-
          python -m unittest tests.test_gui tests.test_pipeline tests.test_resample tests.test_engine
          tests.test_modimport tests.test_compose tests.test_record tests.test_library tests.test_mosaic
          tests.test_spectral tests.test_gpimport tests.test_midiimport tests.test_faust tests.test_workflow
          tests.test_release070 tests.test_release080 tests.test_release080_import tests.test_release080_dsp
          tests.test_import tests.test_synth
      - name: Page tests
        run: >-
          python -m unittest tests.test_page tests.test_workflow_page tests.test_release070_page
          tests.test_release080_page tests.test_features080_page
