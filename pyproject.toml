[project]
name = "vulturetracker"
version = "0.4.0"
description = "Compile human-readable YAML songs to Impulse Tracker modules"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
synth = ["pedalboard>=0.9", "mido>=1.3", "numpy"]
gui = ["pywebview>=5", "numpy", "imageio-ffmpeg"]
record = ["sounddevice>=0.4.6", "numpy"]

[project.scripts]
vulturetracker = "vulturetracker.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vulturetracker"]

[tool.setuptools.package-data]
vulturetracker = ["gui.html", "icon.png", "web/*", "web/licenses/*"]
