[project]
name = "vulturetracker"
dynamic = ["version"]
description = "Compile human-readable YAML songs to Impulse Tracker modules"
readme = "README.md"
license = {text = "MIT"}  # the source; the Windows exe packs GPL-3.0 parts (THIRD_PARTY.md)
authors = [{name = "shadoh420"}]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/shadoh420/VultureTracker"
Issues = "https://github.com/shadoh420/VultureTracker/issues"
Changelog = "https://github.com/shadoh420/VultureTracker/blob/main/CHANGELOG.md"
Security = "https://github.com/shadoh420/VultureTracker/blob/main/SECURITY.md"

[project.optional-dependencies]
synth = ["pedalboard>=0.9", "mido>=1.3", "numpy"]
gui = ["pywebview>=5", "numpy", "imageio-ffmpeg"]
record = ["sounddevice>=0.4.6", "numpy"]
gp = ["pyguitarpro>=0.9", "numpy"]
midi = ["mido>=1.3", "numpy"]
all = ["vulturetracker[synth,gui,record,gp,midi]"]
# the AGENT panel's Anthropic provider and the OS credential store for its key (not in `all`: the exe does not pack them)
agent = ["anthropic", "keyring"]
# what tools/build_exe.py needs besides `all` (requirements-build.txt pins them for the exe)
build = ["pyinstaller", "Pillow"]
# what the tests need (CI installs it): the page tests drive Playwright's Chromium, the package test builds a wheel
test = ["numpy", "imageio-ffmpeg", "Pillow", "playwright", "pyguitarpro>=0.9", "mido>=1.3", "setuptools>=61"]

[project.scripts]
vulturetracker = "vulturetracker.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vulturetracker"]

[tool.setuptools.dynamic]
version = {attr = "vulturetracker.__version__"}

[tool.setuptools.package-data]
vulturetracker = ["gui.html", "icon.png", "web/*", "web/licenses/*", "licenses/*.txt", "faust_examples/*.dsp"]
