# Iron Relay: second VultureTracker demo, modelled on late-90s arena-shooter modules.
# D minor, 140 BPM. Speed 3 with 8 rows per beat (32nd-note grid, 32 rows per bar), 128-row patterns.
# Every sample is rendered from Surge XT by demo2/kit.yaml (python -m vulturetracker synth demo2/kit.yaml).
# The patterns below are laid out by demo2/gen_patterns.py; edit either this file or the generator.
# Build: python -m vulturetracker build demo2/iron_relay.yaml --render demo2/iron_relay.wav

module:
  title: Iron Relay
  tempo: 140          # BPM = tempo x 24 / (speed x rows per beat) = 140 x 24 / (3 x 8)
  speed: 3
  global_volume: 128
  mix_volume: 110
  channels:
    - {name: Kick,      pan: 32, volume: 62}
    - {name: Snare,     pan: 30, volume: 56}
    - {name: Hats,      pan: 40, volume: 34}
    - {name: Cymbals,   pan: 24, volume: 34}
    - {name: Toms,      pan: 32, volume: 44}
    - {name: FX,        pan: 32, volume: 40}
    - {name: Bass,      pan: 32, volume: 40}
    - {name: Arp,       pan: 20, volume: 36}
    - {name: Arp echo,  pan: 46, volume: 36}
    - {name: Pad 1,     pan: 16, volume: 28}
    - {name: Pad 2,     pan: 32, volume: 28}
    - {name: Pad 3,     pan: 48, volume: 28}
    - {name: Choir,     pan: 32, volume: 38}
    - {name: Stab,      pan: 38, volume: 40}
    - {name: Lead,      pan: 28, volume: 56}
    - {name: Lead echo, pan: 42, volume: 52}

samples:
  1:  {file: ../samples/surge/kick.wav, name: Kick}
  2:  {file: ../samples/surge/snare.wav, name: Snare}
  3:  {file: ../samples/surge/hat.wav, name: Hat}
  4:  {file: ../samples/surge/hat_open.wav, name: Hat open}
  5:  {file: ../samples/surge/crash.wav, name: Crash}
  6:  {file: ../samples/surge/riser.wav, name: Reverse crash}
  7:  {file: ../samples/surge/tom.wav, name: Tom, base_note: C-4}
  8:  {file: ../samples/surge/bass_c3.wav, name: Dist bass C-3, base_note: C-3}
  9:  {file: ../samples/surge/bass_c4.wav, name: Dist bass C-4, base_note: C-4}
  10: {file: ../samples/surge/pad.wav, name: Warm pad, base_note: C-4, loop: from_wav, stereo: true}
  11: {file: ../samples/surge/choir.wav, name: Retro choir, base_note: C-5, loop: from_wav, stereo: true}
  12: {file: ../samples/surge/stab.wav, name: Minor 7 stab, base_note: C-4}
  13:
    file: ../samples/surge/lead.wav
    name: Moogy saw lead
    base_note: C-5
    loop: from_wav
    vibrato: {type: sine, speed: 10, depth: 5, rate: 24}   # auto-vibrato that eases in on long notes
  14: {file: ../samples/surge/arp.wav, name: Arp phrase Dm, base_note: D-4}
  15: {file: ../samples/surge/sweep.wav, name: Filter sweep, base_note: D-3, stereo: true}

instruments:
  1:
    name: Drum kit
    keymap:
      - {notes: C-5, sample: Kick, play_note: C-5}
      - {notes: D-5, sample: Snare, play_note: C-5}
      - {notes: F#5, sample: Hat, play_note: C-5}
      - {notes: A#5, sample: Hat open, play_note: C-5}
      - {notes: C#6, sample: Crash, play_note: C-5}
    nna: cut
  2: {name: Tom, sample: Tom, nna: cut}
  3: {name: Reverse crash, sample: Reverse crash, nna: cut}
  4:
    name: Dist bass
    keymap:                                   # one sample per octave region
      - {notes: C-0..B-3, sample: 8}
      - {notes: C-4..B-9, sample: 9}
    nna: cut
    fadeout: 128
    volume_envelope: {nodes: [[0, 64], [6, 54], [30, 46]], sustain: 2}
  5: {name: Arp phrase, sample: 14, nna: cut}
  6:
    name: Pad
    sample: 10
    nna: fade                                 # chords crossfade instead of cutting
    dct: note
    dca: fade
    fadeout: 14
    volume_envelope: {nodes: [[0, 0], [16, 48], [48, 64], [160, 54]], sustain: 3}
    panning_envelope: {nodes: [[0, -8], [96, 8], [192, -8]], loop: [0, 2]}
  7:
    name: Choir
    sample: 11
    nna: fade
    fadeout: 10
    volume_envelope: {nodes: [[0, 0], [32, 56], [64, 64]], sustain: 2}
  8: {name: Stab, sample: 12, nna: cut}
  9:
    name: Lead
    sample: 13
    nna: cut
    fadeout: 40
    volume_envelope: {nodes: [[0, 64], [8, 54], [48, 48]], sustain: 2}
  10: {name: Sweep, sample: 15, nna: fade, fadeout: 6}

orders: [intro, a, a2, b, b2, break, c, c2]

