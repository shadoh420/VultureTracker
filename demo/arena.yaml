# Arena Pulse: demo song for the VultureTracker pipeline.
# Late-90s arena-shooter style: E minor, 138 BPM, ~42 s loop (the intro plays once,
# then 'c' jumps back to 'a' with B01).
# Build:  python -m vulturetracker build demo/arena.yaml --render demo/arena.wav

module:
  title: Arena Pulse
  tempo: 138          # BPM at speed 6 with 4 rows per beat
  speed: 6
  global_volume: 128
  mix_volume: 68
  channels:
    - {name: Kick,      pan: 32, volume: 64}
    - {name: Snare,     pan: 28, volume: 56}
    - {name: Hats,      pan: 42, volume: 44}
    - {name: Bass,      pan: 32, volume: 60}
    - {name: Pad 1,     pan: 18, volume: 40}
    - {name: Pad 2,     pan: 32, volume: 40}
    - {name: Pad 3,     pan: 46, volume: 40}
    - {name: Lead,      pan: 26, volume: 50}
    - {name: Lead echo, pan: 44, volume: 50}

# Placeholder samples from samples/gen_placeholders.py. Swap in real WAVs by changing 'file'
# (and base_note / loop to match the new recording).
samples:
  1: {file: ../samples/kick.wav, name: Kick}
  2: {file: ../samples/snare.wav, name: Snare}
  3: {file: ../samples/hat_closed.wav, name: Hat closed, volume: 48}
  4: {file: ../samples/hat_open.wav, name: Hat open, volume: 44}
  5:
    file: ../samples/bass.wav
    name: Saw bass
    base_note: C-3              # the WAV is a C-3 tone
    loop: {start: 32768}        # loop the settled tail (end defaults to the sample end)
  6:
    file: ../samples/pad.wav
    name: Detuned pad
    base_note: C-5
    loop: {start: 0}            # whole sample loops
  7:
    file: ../samples/lead.wav
    name: Square lead
    base_note: C-5
    loop: {start: 0}
    vibrato: {type: sine, speed: 8, depth: 4, rate: 32}   # gentle auto-vibrato that fades in

instruments:
  1:
    name: Drum kit
    # One instrument, four samples: GM-style keys, each played at its original pitch.
    keymap:
      - {notes: C-5, sample: Kick, play_note: C-5}
      - {notes: D-5, sample: Snare, play_note: C-5}
      - {notes: F#5, sample: Hat closed, play_note: C-5}
      - {notes: A#5, sample: Hat open, play_note: C-5}
    nna: cut
  2:
    name: Bass
    sample: Saw bass
    fadeout: 256                # fast release
    nna: cut
    volume_envelope:
      nodes: [[0, 64], [3, 52], [16, 42]]
      sustain: 2                # hold at 42 until the next note or note-off
  3:
    name: Pad
    sample: Detuned pad
    fadeout: 20                 # slow release when a chord changes
    nna: fade                   # the old chord fades out under the new one
    dct: note                   # ...but the same note retriggered replaces itself
    dca: fade
    volume_envelope:
      nodes: [[0, 0], [24, 44], [48, 64], [96, 52]]
      sustain: 3
    panning_envelope:
      nodes: [[0, -6], [64, 6], [128, -6]]
      loop: [0, 2]              # slow stereo drift
  4:
    name: Lead
    sample: Square lead
    fadeout: 48
    nna: cut
    volume_envelope:
      nodes: [[0, 64], [6, 50], [30, 44]]
      sustain: 2
    pitch_envelope:
      nodes: [[0, -2], [3, 0]]  # a one-semitone scoop into every note

orders: [intro, a, b, b2, break, c]

